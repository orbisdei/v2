# Build check for every pull request.
#
# This is now the ONLY pre-merge signal that the app still builds. Vercel
# preview deployments are off by default (scripts/vercel-ignore-build.sh),
# because each one fully invalidates the ISR cache and re-prerenders the whole
# site/tag catalog. A build here validates the same things and writes nothing
# to Vercel's cache.
#
# It earns its keep — three separate breakages reached main this way:
# sharp 0.35.0 shipped an exports map with no `types` condition; tailwindcss 4
# moved its PostCSS plugin to a separate package; typescript 7 dropped the
# compiler API Next.js drives. Note the last two are invisible to
# `tsc --noEmit` and only surface in a real `next build`, which is why the
# build step below matters and the type check alone is not enough.
#
# Mobile-only dependency bumps are built too, deliberately: web and mobile
# share one hoisted node_modules, so an Expo/React Native bump that drags in a
# second React copy shows up in the web build and nowhere else.
#
# Repository secrets needed for the full build step:
#   SUPABASE_URL        — https://<ref>.supabase.co
#   SUPABASE_ANON_KEY   — the anon/publishable key (public by design; it ships
#                         in the browser bundle already)
# Add them in BOTH places under Settings -> Secrets and variables:
#   * Actions    — used by ordinary PRs
#   * Dependabot — used by PRs Dependabot opens, which cannot read Actions
#                  secrets at all
# Without them the job still type-checks and warns rather than failing red.
name: PR build check

on:
  pull_request:

permissions:
  contents: read

# A new push supersedes any run still going for the same PR.
concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Root install: this is the workspace root, so it covers mobile and
      # packages/shared as well.
      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Check for Supabase credentials
        id: creds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # Placeholders for the non-Supabase env vars: they're only read at
      # request time by API routes, but their clients are constructed at
      # module scope, so page-data collection fails without something set.
      - name: Production build
        if: steps.creds.outputs.available == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://orbisdei.org
          RESEND_API_KEY: re_placeholder_for_build
          GEMINI_API_KEY: placeholder
          R2_ACCOUNT_ID: placeholder
          R2_ACCESS_KEY_ID: placeholder
          R2_SECRET_ACCESS_KEY: placeholder
          R2_BUCKET_NAME: orbis-dei-images
          R2_PUBLIC_URL: https://images.orbisdei.org
          CRON_SECRET: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder

      - name: Note skipped build
        if: steps.creds.outputs.available != 'true'
        run: |
          echo "::warning::Type check passed, but the full next build was skipped," \
               "so build-only breakages (PostCSS/Tailwind, Next's TypeScript" \
               "integration) would NOT be caught. Add SUPABASE_URL and" \
               "SUPABASE_ANON_KEY under Settings -> Secrets and variables, in" \
               "both Actions and Dependabot, to enable it."
